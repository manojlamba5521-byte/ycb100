<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">ConsequenceBench</title>
  <desc id="description">Open benchmark for whether an AI agent leaves an external system in the correct state.</desc>
  <rect width="1280" height="640" fill="#F4F6F8"/>
  <rect x="38" y="38" width="1204" height="564" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
  <rect x="38" y="38" width="16" height="564" fill="#2457D6"/>

  <text x="92" y="105" font-family="Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="700" fill="#2457D6" letter-spacing="1.5">OPEN AGENT EVALUATION</text>
  <text x="92" y="185" font-family="Arial, 'Segoe UI', sans-serif" font-size="55" font-weight="750" fill="#101828">ConsequenceBench</text>
  <text x="92" y="238" font-family="Arial, 'Segoe UI', sans-serif" font-size="25" font-weight="400" fill="#344054">Did the agent leave the external system</text>
  <text x="92" y="274" font-family="Arial, 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#101828">in the correct state?</text>

  <line x1="92" y1="322" x2="665" y2="322" stroke="#D0D5DD" stroke-width="2"/>
  <text x="92" y="370" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#101828">100 SCENARIOS</text>
  <text x="286" y="370" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#101828">300 WORLDS</text>
  <text x="464" y="370" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#101828">5 DOMAINS</text>
  <text x="92" y="408" font-family="Arial, 'Segoe UI', sans-serif" font-size="18" fill="#475467">Authority  ·  Evidence  ·  Recovery  ·  Readback  ·  Compensation</text>

  <rect x="724" y="94" width="454" height="78" fill="#F8F9FB" stroke="#D0D5DD"/>
  <text x="754" y="126" font-family="Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#667085">01 / DECISION</text>
  <text x="754" y="153" font-family="Arial, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101828">Was the chosen action correct?</text>

  <rect x="724" y="190" width="454" height="78" fill="#F8F9FB" stroke="#D0D5DD"/>
  <text x="754" y="222" font-family="Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#667085">02 / CONSEQUENCE</text>
  <text x="754" y="249" font-family="Arial, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101828">What actually changed?</text>

  <rect x="724" y="286" width="454" height="78" fill="#F8F9FB" stroke="#D0D5DD"/>
  <text x="754" y="318" font-family="Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#667085">03 / EVIDENCE</text>
  <text x="754" y="345" font-family="Arial, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101828">Can the final state be proved?</text>

  <rect x="724" y="382" width="454" height="78" fill="#FDECEC" stroke="#E6A7A0"/>
  <text x="754" y="414" font-family="Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#B42318">HARD FAILURE</text>
  <text x="754" y="441" font-family="Arial, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101828">Unsafe or duplicate effect</text>

  <line x1="92" y1="510" x2="1178" y2="510" stroke="#D0D5DD" stroke-width="2"/>
  <text x="92" y="553" font-family="Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#2457D6">GITHUB.COM/YUVIN-LABS/CONSEQUENCEBENCH</text>
  <text x="1178" y="553" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#667085" text-anchor="end">DEVELOPMENT PREVIEW  ·  SIMULATED EFFECTS</text>
</svg>
